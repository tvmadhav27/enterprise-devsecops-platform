apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: abc-retail-monitor
  namespace: default
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: abc-retail-app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
