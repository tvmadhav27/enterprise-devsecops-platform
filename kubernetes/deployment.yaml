apiVersion: apps/v1
kind: Deployment
metadata:
  name: abc-retail-app
  namespace: default
  labels:
    app: abc-retail-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: abc-retail-app
  template:
    metadata:
      labels:
        app: abc-retail-app
    spec:
      containers:
        - name: abc-retail-app
          image: docker.io/tvmadhav27/abc-retail-app:20
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
